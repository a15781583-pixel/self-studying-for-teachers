<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習診断コメント作成アシスタント</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-left">
      <i class="ti ti-school"></i>
      <h1 class="header-title">学習診断コメント作成アシスタント</h1>
    </div>
    <div class="header-right">
      <div class="api-key-group">
        <div class="api-key-top">
          <label for="api-key">Gemini API Key</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="api-key-link">
            キーを取得 <i class="ti ti-external-link"></i>
          </a>
        </div>
        <input type="password" id="api-key" placeholder="AI StudioのAPIキーを入力">
      </div>
    </div>
  </header>

  <!-- タブバー -->
  <div class="tab-bar">
    <div class="tab-list" id="tab-list">
      <!-- JavaScriptで動的生成 -->
    </div>
    <button type="button" class="tab-add-btn" id="add-tab-btn">
      <i class="ti ti-plus"></i> 生徒を追加
    </button>
  </div>

  <!-- メインレイアウト -->
  <main class="layout">
    
    <!-- 左パネル：入力フォーム -->
    <section class="panel" id="form-panel">
      
      <!-- 基本情報 -->
      <div class="sec-title">基本情報</div>
      
      <div class="field">
        <label for="student-name">生徒氏名 <span class="badge badge-req">必須</span></label>
        <input type="text" id="student-name" placeholder="例：山田 太郎">
      </div>

      <div class="field">
        <label for="student-grade">学年 <span class="badge badge-req">必須</span></label>
        <select id="student-grade">
          <option value="">選択してください</option>
          <option value="小学4年">小学4年</option>
          <option value="小学5年">小学5年</option>
          <option value="小学6年">小学6年</option>
          <option value="中学1年">中学1年</option>
          <option value="中学2年">中学2年</option>
          <option value="中学3年">中学3年</option>
          <option value="高校1年">高校1年</option>
          <option value="高校2年">高校2年</option>
          <option value="高校3年">高校3年</option>
        </select>
      </div>

      <div class="field">
        <label>指導科目 <span class="badge badge-req">必須</span></label>
        <div class="chip-group" id="subject-chips">
          <button type="button" class="chip" data-value="英語">英語</button>
          <button type="button" class="chip" data-value="数学">数学</button>
          <button type="button" class="chip" data-value="国語">国語</button>
          <button type="button" class="chip" data-value="理科">理科</button>
          <button type="button" class="chip" data-value="社会">社会</button>
        </div>
      </div>

      <!-- 学習状況評価 -->
      <div class="sec-title">学習状況評価</div>

      <div class="field">
        <label>授業理解度（10段階） <span class="badge badge-opt">任意</span></label>
        <div class="scale-row">
          <span class="scale-edge-label">低い</span>
          <div class="scale-group" id="understanding-scale">
            <!-- 1〜10のボタンをJS生成またはHTML直書 -->
          </div>
          <span class="scale-edge-label">高い</span>
        </div>
      </div>

      <div class="field">
        <label>学習意欲・姿勢（10段階） <span class="badge badge-opt">任意</span></label>
        <div class="scale-row">
          <span class="scale-edge-label">低い</span>
          <div class="scale-group" id="motivation-scale">
            <!-- 1〜10のボタンをJS生成またはHTML直書 -->
          </div>
          <span class="scale-edge-label">高い</span>
        </div>
      </div>

      <!-- テスト結果履歴 -->
      <div class="sec-title">テスト・成績履歴</div>
      <div id="test-entries-container">
        <!-- テスト結果項目が動的に追加される -->
      </div>
      <button type="button" class="test-add-btn" id="add-test-btn">
        <i class="ti ti-plus"></i> テスト結果を追加
      </button>

      <!-- 講師メモ -->
      <div class="sec-title">講師所感・指導メモ</div>
      <div class="field">
        <label for="teacher-notes">普段の様子・特記事項 <span class="badge badge-opt">任意</span></label>
        <textarea id="teacher-notes" placeholder="例：宿題の提出率は良いが、計算ミスが目立つ。次回は応用問題を中心に指導予定。"></textarea>
      </div>

      <!-- 生成ボタン (Sticky) -->
      <button type="button" class="gen-btn" id="generate-btn">
        <i class="ti ti-sparkles"></i> 診断コメントを自動生成
      </button>
    </section>

    <!-- 右パネル：生成結果 -->
    <section class="panel" id="result-panel">
      <!-- 初期状態/ローディング/結果表示をJSで切替 -->
      <div id="state-result">
        <div class="state">
          <i class="ti ti-notes icon-lg"></i>
          <div class="state-title">診断コメントがここに表示されます</div>
          <div class="state-sub">左側のフォームに必要な情報を入力し、<br>「診断コメントを自動生成」を押してください。</div>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
